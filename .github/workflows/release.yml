# Release workflow - triggered on tag push to main branch
# Builds cross-platform binaries and creates GitHub Release
name: Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v0.1.0, etc.

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'

    - name: Run tests
      run: go test -v ./...

    - name: Build Linux amd64
      run: GOOS=linux GOARCH=amd64 go build -o chgctx-linux-amd64 .

    - name: Build Linux arm64
      run: GOOS=linux GOARCH=arm64 go build -o chgctx-linux-arm64 .

    - name: Build macOS amd64
      run: GOOS=darwin GOARCH=amd64 go build -o chgctx-darwin-amd64 .

    - name: Build macOS arm64 (Apple Silicon)
      run: GOOS=darwin GOARCH=arm64 go build -o chgctx-darwin-arm64 .

    - name: Build Windows amd64
      run: GOOS=windows GOARCH=amd64 go build -o chgctx-windows-amd64.exe .

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          chgctx-linux-amd64
          chgctx-linux-arm64
          chgctx-darwin-amd64
          chgctx-darwin-arm64
          chgctx-windows-amd64.exe
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
